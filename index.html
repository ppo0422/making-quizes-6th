<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 퀴즈 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 교실 벽 같은 연한 청회색 바탕 위에 종이 인덱스 카드를 올려놓은 화면. 한 줄 단 배치, 태블릿 기준 큰 터치 영역 */
  --wall:#e7ecf4;
  --surface:#ffffff;
  --ink:#1c2745;
  --muted:#5a6684;
  --accent:#2c53c4;
  --accent-soft:#e3eafb;
  --marker:#ffd94a;
  --paper:#fffdf5;
  --rule:#cbdaf0;
  --redline:#e0605a;
  --border:#d3dbe8;
  --fix:#c23a3a; --fix-bg:#fdeceb;
  --check:#8a5d00; --check-bg:#fff3d1;
  --good:#22744a; --good-bg:#e3f4ea;
  --font-display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --font-en:'Andika','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
.en{font-family:var(--font-en)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* 상단 */
.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.top-inner{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:22px;display:flex;align-items:center;gap:8px}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-weight:700;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:14px}
.steps{max-width:820px;margin:0 auto;padding:0 16px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;list-style:none}
.steps li{font-size:14px;text-align:center;padding:6px 4px;border-radius:8px;background:var(--wall);color:var(--muted)}
.steps li.on{background:var(--accent);color:#fff;font-weight:700}
.steps li.done{background:var(--accent-soft);color:var(--accent)}
.steps li.step-btn{padding:0;background:none}
.steps li.step-btn button{width:100%;height:100%;min-height:34px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--surface);color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;padding:4px}
.steps li.step-btn small{font-weight:400;font-size:11px;display:block;line-height:1.2}

main{max-width:820px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.label{font-weight:700;font-size:16px}
.hint{color:var(--muted);font-size:15px}

.hero{display:grid;grid-template-columns:1fr minmax(180px,260px);gap:16px;align-items:center}
.hero-text{display:flex;flex-direction:column;gap:12px}
.hero-art svg{display:block;width:100%;height:auto}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero-art{order:-1;max-width:220px;margin:0 auto}}
@media (prefers-reduced-motion:no-preference){
  .hero-art .bubble{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .hero-art .sparkle{animation:twinkle 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
}
/* 문제 유형 살펴보기 */
details.types{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 18px}
details.types>summary{cursor:pointer;font-family:var(--font-display);font-size:20px}
.types-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.type-card{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fafbfe}
.type-card.mine{border-color:var(--accent);background:var(--accent-soft)}
.type-head{display:flex;gap:10px;align-items:center}
.type-no{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:17px}
.type-name{font-weight:700;line-height:1.3}
.type-en{font-family:var(--font-en);font-size:13px;color:var(--muted)}
.type-tags{display:flex;gap:6px}
.type-tags span{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--wall);color:var(--muted)}
.type-ex{background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:8px 10px;font-size:16px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.type-ans{font-size:14px;color:var(--good);font-weight:700}
.type-tip{margin:0;font-size:14px;color:var(--muted)}
.type-use{margin-top:auto;min-height:44px;padding:8px 12px;font-size:15px}
.type-card.mine .type-use{color:var(--accent);border-color:var(--accent)}

/* 피드백: 상태 두 칸 + 내 문제 카드 */
.status{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;font-weight:700}
.st-big{font-family:var(--font-display);font-size:30px;font-weight:400;line-height:1.1}
.st-bad{background:var(--fix-bg);color:var(--fix)}
.st-ok{background:var(--good-bg);color:var(--good)}
.st-warn{background:var(--accent-soft);color:var(--accent)}
.fb-card{gap:0;padding:8px 20px}
.fb-row{display:grid;grid-template-columns:72px 1fr 28px;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--border)}
.fb-row:first-child{border-top:0}
.fb-lab{font-weight:700;color:var(--muted);font-size:15px;padding-top:2px}
.fb-text{font-family:var(--font-en);font-size:19px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.fb-mark{font-size:20px;font-weight:700;color:var(--good);text-align:center}
.fb-row.bad .fb-mark{color:var(--fix)}
mark.err{background:var(--fix-bg);color:var(--fix);text-decoration:underline wavy var(--fix);text-underline-offset:4px;border-radius:3px;padding:0 2px}
.err-end{color:var(--fix);font-size:14px;vertical-align:middle;margin-left:2px}
.fix-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fix-chip{background:var(--fix);color:#fff;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.fix-chip.en{font-family:var(--font-en)}
.tip-chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.ok-tag{font-family:var(--font-body);font-size:13px;font-weight:700;color:#fff;background:var(--good);border-radius:6px;padding:1px 7px;vertical-align:middle}
.diff-fix{gap:10px}
.fb-ctx{font-size:15px;color:var(--muted);margin-top:4px}
.fb-ctx .en{font-size:16px;color:var(--ink)}
.diff-q{font-weight:700}
@media (max-width:480px){.fb-row{grid-template-columns:56px 1fr 22px}.st-big{font-size:26px}}

/* 도우미 말풍선 */
.bot{display:flex;gap:12px;align-items:flex-start}
.bot-face{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;transform:rotate(-4deg)}
.bot-bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:12px 16px;max-width:62ch}
.bot-name{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:2px}

/* 버튼·칩 */
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:17px;cursor:pointer;background:var(--accent);color:#fff;min-height:52px}
.btn:disabled{background:#b9c3d6;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:48px;text-align:left}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent)}

/* 입력 */
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number],textarea{border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface);width:100%}
textarea{min-height:120px;resize:vertical;font-family:var(--font-en);font-size:18px;line-height:1.6}
input.en-in{font-family:var(--font-en);font-size:18px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.opt-num{font-family:var(--font-display);font-size:22px;width:30px;text-align:center;color:var(--muted)}
.mark{border:2px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;min-height:44px}
.mark[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}

/* 단원 */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.unit{border:2px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px}
.unit:hover{border-color:var(--accent)}
.unit-group{display:flex;flex-direction:column;gap:10px}
.unit-sem{font-size:22px;color:var(--muted)}
.unit-no{font-family:var(--font-display);font-size:26px;color:var(--accent)}
.unit-title{font-family:var(--font-en);font-weight:700}
.unit-words{font-family:var(--font-en);color:var(--muted);font-size:14px}

details.ref{border:1.5px dashed var(--border);border-radius:12px;padding:10px 14px;background:#fafbfe}
details.ref summary{cursor:pointer;font-weight:700}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px;margin-top:8px}
.ref h4{margin:12px 0 4px;font-size:15px;color:var(--muted)}
.ref-item{font-size:15px}
.ref-item b{font-family:var(--font-en)}

/* 피드백 */
.fb{display:flex;flex-direction:column;gap:8px}
.fb-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-radius:10px;padding:10px 14px}
.fb-item.fix{background:var(--fix-bg)}
.fb-item.check{background:var(--check-bg)}
.fb-item.good{background:var(--good-bg)}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap;margin-top:2px}
.fix .tag{background:var(--fix)}
.check .tag{background:var(--check)}
.good .tag{background:var(--good)}
.fb-where{font-size:13px;color:var(--muted)}
.fb-title{font-weight:700}
.fb-detail{font-size:15px}
.fb-detail .en{font-size:16px}

.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meter div{height:14px;border-radius:7px;background:var(--wall)}
.meter.l0 div:nth-child(1){background:#5fb486}
.meter.l1 div:nth-child(-n+2){background:#e3b23c}
.meter.l2 div{background:#d9645c}
.meter-labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:13px;color:var(--muted);text-align:center}
.diff-name{font-family:var(--font-display);font-size:24px}
ul.plain{margin:0;padding-left:20px}

.box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;color:#fff}
[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}

/* 피드백 난이도 */
.diff-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.diff-badge{color:#fff;font-weight:700;border-radius:8px;padding:3px 12px;font-size:15px;white-space:nowrap}

.final-head.answer-head{background:var(--good)}
/* 목표 난이도 비교 */
.target-row{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.target-cell{flex:1 1 180px;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.target-val{font-family:var(--font-display);font-size:24px;line-height:1.2}
.tip-box{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-radius:10px;padding:10px 14px;background:var(--accent-soft)}
.tip-box .tag{background:var(--accent)}
.target-arrow{align-self:center;font-size:24px;color:var(--muted)}
details.why summary{cursor:pointer;color:var(--muted);font-size:15px}
.think{border-color:#f0dc8a;background:#fffdf3}
.thought{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:16px}
.thought .kicker{color:var(--accent)}

/* 완성 화면: 친구들이 돌아다니며 보는 화면 */
.final-head{background:var(--accent);color:#fff;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.final-name{font-family:var(--font-display);font-size:30px;line-height:1.25}
.final-no{background:var(--marker);color:var(--ink);border-radius:10px;padding:0 10px;margin-right:4px}
.qbox{background:var(--paper);border-radius:14px;box-shadow:0 1px 2px rgba(28,39,69,.12),0 6px 16px rgba(28,39,69,.10);overflow:hidden}
.qbox-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:2px solid var(--redline);flex-wrap:wrap}
.qno{font-family:var(--font-display);font-size:40px;line-height:1}
.qmeta{display:flex;gap:8px;align-items:center}
.qtext{padding:16px 20px 4px;font-family:var(--font-en);font-size:23px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.qopts{list-style:none;margin:0;padding:8px 20px 18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-en);font-size:22px}
.qopts li{display:flex;gap:10px;align-items:baseline}
.onum{font-family:var(--font-display);color:var(--muted);flex:none}
.qbox .qtext:last-child{padding-bottom:20px}
.qanswer{margin:0 20px 18px;background:var(--good-bg);border-radius:10px;padding:10px 14px;font-family:var(--font-en);font-size:22px;font-weight:700;color:var(--good)}
.kicker{font-family:var(--font-body);font-size:14px;font-weight:700;margin-right:6px}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold-fill{position:absolute;inset:0;width:0;background:var(--marker);transition:width .15s linear}
.hold.holding .hold-fill{width:100%;transition:width 2s linear}
.hold-label{position:relative}

.confirm{background:var(--fix-bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.teacher{border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;background:#fafbfe}
.teacher summary{cursor:pointer;font-weight:700}
.teacher table{border-collapse:collapse;margin:8px 0;font-size:15px;width:100%}
.teacher td{border-top:1px solid var(--border);padding:6px 8px;vertical-align:top}
.teacher td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{background:var(--check-bg);border-radius:8px;padding:8px 12px;font-size:14px}
.big4{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.big4 .slot{border:2px solid var(--border);border-radius:10px;padding:12px;background:var(--surface)}
.big4 .slot b{font-family:var(--font-display);font-size:20px;font-weight:400}
</style>
</head>
<body>
<div class="top"><div class="top-inner" id="topbar"></div><ol class="steps" id="steps" aria-label="진행 단계"></ol></div>
<main id="app"></main>

<script id="engine">
/* ============================================================
   단원 자료 (6학년 영어 교과서 1~12단원)
   ============================================================ */
const UNITS = {

      {q:"How can I get to Haeundae Beach?", a:"You can get there by bus.", qko:"해운대 해수욕장에 어떻게 갈 수 있나요?", ako:"버스로 갈 수 있어요."},

    ],
    grammar: [
      {point:"by + 교통수단", ex:"You can get there by subway.", target:"by", options:["by","to"], wrong:"You can get there to subway.", tip:"교통수단을 말할 때는 교통수단 앞에 by를 써요."},
      {point:"How can I get to ~?", ex:"How can I get to the park?", target:"to", options:["to","by"], wrong:"How can I get by the park?", tip:"'~에 어떻게 가나요?'는 How can I get to ~?로 물어요."},
      {point:"위치 in front of", ex:"It's in front of the bank.", target:"in front of", options:["in front of","in front"], wrong:"It's in front the bank.", tip:"'~ 앞에'는 in front of로 써요. of를 빠뜨리지 않아요."}
    ]
  },
  8: {
    title: "I Want to Be a Drone Pilot",
    words: [
      ["drone pilot","드론 조종사"],["movie director","영화감독"],["soccer player","축구 선수"],
      ["computer programmer","컴퓨터 프로그래머"],["3D designer","3D 디자이너"],["traveler","여행가"],
      ["writer","작가"],["nurse","간호사"],["movie star","영화배우"],["comic book writer","만화 작가"],["future","미래"],["dinosaur","공룡"],["area","구역"],["safe","안전한"],["movie","영화"]
    ],
    phrases: [

function lemmaCandidates(word){
  const w=word.toLowerCase(); const c=[w];
  if(IRREGULAR[w]) c.push(IRREGULAR[w]);
  const ap=w.match(/^(.+?)('s|'re|'m|'ll|'ve|'d|n't)$/); if(ap){c.push(ap[1]);}
  const add=x=>{ if(x && x.length>1) c.push(x); };
  if(/ies$/.test(w)) add(w.slice(0,-3)+"y");
  if(/es$/.test(w)) add(w.slice(0,-2));
  if(/s$/.test(w)) add(w.slice(0,-1));
  if(/ied$/.test(w)) add(w.slice(0,-3)+"y");
  if(/ed$/.test(w)){ const b=w.slice(0,-2); add(b); add(w.slice(0,-1)); if(/(.)\1$/.test(b)) add(b.slice(0,-1)); }
  if(/ing$/.test(w)){ const b=w.slice(0,-3); add(b); add(b+"e"); if(/(.)\1$/.test(b)) add(b.slice(0,-1)); }
  if(/ier$/.test(w)) add(w.slice(0,-3)+"y");
  if(/iest$/.test(w)) add(w.slice(0,-4)+"y");
  if(/er$/.test(w)){ const b=w.slice(0,-2); add(b); add(w.slice(0,-1)); if(/(.)\1$/.test(b)) add(b.slice(0,-1)); }
  if(/est$/.test(w)){ const b=w.slice(0,-3); add(b); add(w.slice(0,-2)); if(/(.)\1$/.test(b)) add(b.slice(0,-1)); }
  if(/ly$/.test(w)) add(w.slice(0,-2));
  return c;
}
function isKnown(w,known){ return lemmaCandidates(w).some(x=>known.has(x)); }

function lev(a,b){
  a=a.toLowerCase(); b=b.toLowerCase();
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    prev=cur; }
  return prev[n];
}
function suggestFor(w,known,unitFirst){
  const lw=w.toLowerCase(); const limit=lw.length<=4?1:2;
  let best=null,bd=99;
  const scan=list=>{ for(const k of list){ if(Math.abs(k.length-lw.length)>limit) continue; const d=lev(lw,k); if(d<bd && d<=limit){bd=d;best=k;} } };
  scan(unitFirst); if(!best) scan(known);
  return best;
}

/* 철자 점검: 밑줄이 붙은 낱말(빈칸 문제)은 건너뜀 */
function spellCheck(text,known,unitList){
  const cleaned=String(text||"").replace(/[A-Za-z]*_+[A-Za-z_]*/g," ");
  const found=[]; const seen=new Set();
  for(const w of tokens(cleaned)){
    const lw=w.toLowerCase();
    if(lw.length===1 && lw!=="a" && lw!=="i") continue;
    if(seen.has(lw)) continue; seen.add(lw);
    if(isKnown(lw,known)) continue;
    const sug=suggestFor(lw,[...known],unitList);
    if(/^[A-Z]/.test(w) && !sug) continue; // 사람 이름 등
    found.push({word:w,sug});
  }
  return found;
}

function englishSegments(text){
  return String(text||"").split(/\n/).flatMap(line=>{
    const marked=line.replace(/(^|\s)[AB]\s*:/g,"\u0001").replace(/[가-힣ㄱ-ㅎㅏ-ㅣ]+/g,"\u0001").replace(/[\[\]【】]/g,"\u0001");
    return marked.split("\u0001").map(s=>{
      s=s.replace(/^[^A-Za-z_(]+/,"").replace(/[\s'"‘’“”]+$/,"").trim();
      /* 문장을 감싼 괄호·화살표·별표 같은 부호는 떼고 봄 (단어 배열·괄호 고르기 문제는 그대로) */
      if(!s.includes("/")) s=s.replace(/^\(\s*/,"").replace(/[^A-Za-z0-9.?!_]+$/,"").trim();
      return s;
    }).filter(s=>/[A-Za-z_]/.test(s));
  });
}

function baseOf(w,prev){

    {re:/\bby (a|the) (bus|subway|train|airplane)\b/i, title:"by 뒤에는 a, the를 쓰지 않아요", fix:m=>`by ${m[1]} ${m[2]} → by ${m[2]}`},
    {re:/\bin front (?!of\b|with\b|and\b|or\b|to\b|in\b)([A-Za-z]+)/i, title:"'~ 앞에'는 in front of예요", fix:m=>`in front ${m[1]} → in front of ${m[1]}`},
    {re:/\bhow can i get (the|a|by)\b/i, title:"'~에 어떻게 가나요?'는 How can I get to ~?예요", fix:m=>`get ${m[1]} → get to the`}

    {re:/\bgood at (fly|write|play|make|help|design|draw|travel|swim|sing|dance|cook|run)\b/i, title:"good at 뒤에는 -ing를 붙여요", fix:m=>`good at ${m[1]} → good at ${ing(m[1])}`}
  ],

    {re:/\b(paint|invent|build|write|make|draw)\s+(it|the|this|that|a|an|many|hangeul)\b/i,
     cond:(s,m)=>!/\b(can|will|to|did|do|does|didn't|don't|let's|could|should)\s+$/i.test(s.slice(0,m.index)),
     title:"누가 한 일은 과거형으로 써요", fix:m=>`${m[1]} → ${PAST_OF[m[1].toLowerCase()]}`},
    {re:/\byes,?\s*i do\b/i, cond:(s,m,ctx)=>/\bdid you\b/i.test(s+" "+ctx), title:"Did you ~?에는 Yes, I did.로 대답해요", fix:()=>"Yes, I do → Yes, I did"}
  ],
  10:[
    {re:/\bthanks for (help|save|say|come|play|teach|call)\b/i, title:"Thanks for 뒤에는 -ing를 붙여요", fix:m=>`Thanks for ${m[1]} → Thanks for ${ing(m[1])}`},
    {re:/\bi like (spring|summer|autumn|winter),? (?!because\b)(?:([a-z]+) )?i can\b/i, title:"이유 앞에 because를 써요", fix:m=>`${m[1]} ${m[2]?m[2]+" ":""}I can → ${m[1]} because I can`}
  ]
};

   관사(a, an, the) 점검: 규칙으로 확실히 판단할 수 있는 것만
   ============================================================ */
const ART_JOBS=new Set("student teacher doctor nurse cook vet pilot scientist singer writer farmer firefighter designer programmer director traveler artist painter inventor hero dancer player actor police officer astronaut chef engineer baker".split(" "));
const ART_INSTR=new Set("piano guitar violin drums drum flute cello".split(" "));
const ART_SPORTS=new Set("soccer baseball basketball tennis badminton volleyball football".split(" "));
const ART_PLACES=new Set("library park museum hospital bank beach zoo market bookstore gym playground cafeteria classroom restaurant station mountain sea river lake".split(" "));
const ART_UNCOUNT=new Set("water music homework bread milk rice money advice information weather fun math science english soccer baseball basketball tennis badminton juice".split(" "));
/* a water 다음에 오는 말이 이런 말이거나 문장이 끝날 때만 '셀 수 없는 말'로 봄 (a science project는 통과) */
const ART_AFTER_OK=new Set(["","and","or","with","for","in","on","at","every","is","are","was","to","from","after","before","today","now","please","too","here","there","every","each"]);
const ART_NOUN_AFTER=new Set("club class teacher room game team ball lesson bottle cup glass player book test festival program video star show field".split(" "));
const ART_DET=new Set("a an the my your his her our their its this that these those some any every one two three".split(" "));
const ART_TIMES=new Set("morning afternoon evening".split(" "));
/* a 없이 쓰면 틀리는 셀 수 있는 명사 (pizza, cake, chicken, fish처럼 a 없이 써도 되는 말은 넣지 않음) */
const COUNT_NOUNS=new Set(("dog cat bird horse rabbit monkey tiger lion elephant bear zebra giraffe snake frog duck pig cow penguin panda dolphin dinosaur puppy koala kangaroo turtle whale shark owl fox wolf squirrel hamster "+
  "apple banana orange grape strawberry peach tomato carrot potato onion cookie sandwich hamburger egg cupcake donut "+
  "book pencil pen eraser ruler bag cap hat car bike bicycle robot doll ball toy flower tree drone kite computer phone game movie song story picture camera umbrella watch bottle cup box chair desk "+
  "bus train airplane plane ship boat taxi truck "+
  /* 초등 어휘 목록(지도서)과 교과서 단어에서 고른 셀 수 있는 명사 */
  "sun sky album animal apartment arm artist aunt baby bank basket bat bath beach bean bed bee bell belt biscuit board bone bookstore boy bridge brother brush button card carrier child circle city classroom clock cloud club coat comic corner country cousin crayon curtain daughter doctor door doughnut dress drum ear eye face family fan farm farmer father finger foot forest fork friend garden gate girl goal grandfather guitar guy hand head helmet hero hill horse hospital house idea image jacket job key king kitchen knife lady lake lesson letter library map market medal member model moon mouse mouth museum neck newspaper nose notebook nurse office page painter painting parent park partner party piano pilot place prince problem program project queen question quiz restaurant ribbon ring river road rose scientist shirt shoe shop sister skirt sock son spoon star store table tail teacher team telephone tent textbook ticket tooth town uncle vegetable video violin wall website wedding window wife woman writer zoo").split(" "));
const OBJ_VERBS=new Set("like likes liked love loves loved want wants wanted have has had see sees saw need needs buy buys bought eat eats ate draw draws drew make makes made hate hates get gets got take takes took bring brings brought find finds found ride rides rode read reads watch watches catch catches".split(" "));
const BE_FORMS=new Set("is are was were am".split(" "));
const ART_ADJ=new Set("big small new old little cute pretty red blue yellow green black white brown pink purple good bad nice cool fast long short tall funny favorite beautiful great large tiny young".split(" "));
const NOUNISH_AFTER=new Set("food house toy park club show shop store cage ball book game race team pilot player lesson class room ride trip day festival tail shape".split(" "));
const PREPS=new Set("with for to in on at under behind near from about of into over by without beside between".split(" "));
const TRANSPORT=new Set("bus train airplane plane subway bike bicycle car taxi ship boat truck".split(" "));
/* 전치사 뒤에 관사 없이 쓰는 굳은 표현 */
const PREP_OK=new Set(["of town","out of town","for bed","into bed","of bed","on hand","by eye","into place","by heart","in place","to size","in time","on time","in fact","at night","at noon","at work","to work","from work","in person","on purpose","by chance","in case","at first","at last","in turn","on board","at peace","in love","on sale","by heart","in charge","for example","for instance","to bed","in bed","on foot","by hand","in town","at sea","by phone","on page","in class","at school","to school","at home","by mail","in hand"]);
function articleIssues(sentence,unitNo){
  const out=[]; const T=tokens(sentence); const t=T.map(x=>x.toLowerCase());
  const push=(title,from,to)=>out.push({title,detail:`<span class="en">${esc(from)}</span> → <span class="en">${esc(to)}</span>`});
  for(let i=0;i<t.length;i++){
    const w=t[i], n1=t[i+1]||"", n2=t[i+2]||"", prev=t[i-1]||"";
    /* a the, the a */
    if((w==="a"||w==="an"||w==="the") && ["a","an","the"].includes(n1)) push("관사를 두 번 썼어요",`${T[i]} ${T[i+1]}`,T[i+1]);
    /* 직업 앞에 a: be pilot → be a pilot */
    if(["be","am","is","was","i'm","he's","she's","it's"].includes(w) && ART_JOBS.has(n1) && !(n1==="police" && n2!=="officer"))
      push("직업 앞에는 a를 써요",`${T[i]} ${T[i+1]}`,`${T[i]} ${/^[aeiou]/.test(n1)?"an":"a"} ${T[i+1]}`);
    /* 악기 앞에는 the: play piano → play the piano */
    if(["play","plays","played","playing"].includes(w) && ART_INSTR.has(n1)) push("악기 앞에는 the를 써요",`${T[i]} ${T[i+1]}`,`${T[i]} the ${T[i+1]}`);
    /* 운동 앞에는 관사 없이: play the soccer → play soccer */
    if(["play","plays","played","playing"].includes(w) && (n1==="the"||n1==="a") && ART_SPORTS.has(n2)) push("운동 이름 앞에는 a, the를 쓰지 않아요",`${T[i]} ${T[i+1]} ${T[i+2]}`,`${T[i]} ${T[i+2]}`);
    /* in morning → in the morning */
    if(w==="in" && ART_TIMES.has(n1)) push("'아침에'는 in the morning이에요",`in ${T[i+1]}`,`in the ${T[i+1]}`);
    /* go to library → go to the library */
    if(w==="to" && ["go","goes","went","going","get","gets","come","comes","walk","walks"].includes(prev) && ART_PLACES.has(n1))
      push("장소 앞에는 the를 써요",`to ${T[i+1]}`,`to the ${T[i+1]}`);
    /* go to the home → go home */
    if(w==="to" && n1==="the" && n2==="home") push("home 앞에는 to the를 쓰지 않아요",`to the home`,`home`);
    /* 셀 수 있는 명사를 a 없이: like dog → like dogs / like a dog */
    if(OBJ_VERBS.has(w) || (BE_FORMS.has(w) && ["this","that","it"].includes(prev))){
      let j=i+1; while(ART_ADJ.has(t[j]||"")) j++;
      const nn=t[j]||"", after=t[j+1]||"";
      const afterNoun=[after,after.replace(/s$/,""),after.replace(/es$/,""),after.replace(/ies$/,"y")].some(x=>COUNT_NOUNS.has(x)||NOUNISH_AFTER.has(x)||x==="game"||x==="lesson");
      if(COUNT_NOUNS.has(nn) && !/^[A-Z]/.test(T[j]||"") && !afterNoun && !/^(ing|er)$/.test(after) && !(["take","takes","took","taken","taking"].includes(w) && nn==="place")){
        const from=T.slice(i,j+1).join(" "); const adj=T.slice(i+1,j).join(" ");
        const pl=inflect(nn,"s").replace(/^potatos$/,"potatoes").replace(/^tomatos$/,"tomatoes");
        const a=/^[aeiou]/.test(adj||nn)?"an":"a";
        if(["moon","sun","sky","earth","world"].includes(nn)){ out.push({title:"하나뿐인 것 앞에는 the를 써요",detail:`<span class="en">${esc(from)}</span> → <span class="en">${esc(T[i]+" the "+(adj?adj+" ":"")+T[j])}</span>`}); continue; }
        out.push({title:"하나는 a, 여럿은 -s를 붙여요",detail:BE_FORMS.has(w)
          ? `<span class="en">${esc(from)}</span> → <span class="en">${esc(T[i]+" "+a+" "+(adj?adj+" ":"")+T[j])}</span>`
          : `<span class="en">${esc(from)}</span> → <span class="en">${esc(T[i]+" "+(adj?adj+" ":"")+pl)}</span> / <span class="en">${esc(T[i]+" "+a+" "+(adj?adj+" ":"")+T[j])}</span>`});
      }
    }
    /* 전치사 뒤: with dog → with a dog / with dogs, near bank → near the bank */
    if(PREPS.has(w) && !(w==="to" && ["go","goes","went","going","get","gets","come","comes","walk","walks"].includes(prev) && ART_PLACES.has(n1))){
      let j=i+1; while(ART_ADJ.has(t[j]||"")) j++;
      const nn=t[j]||"", after=t[j+1]||"";
      const afterNoun=[after,after.replace(/s$/,""),after.replace(/es$/,""),after.replace(/ies$/,"y")].some(x=>COUNT_NOUNS.has(x)||NOUNISH_AFTER.has(x)||x==="game"||x==="lesson");
      /* to 앞이 want, like, need 같은 말이면 to 뒤는 동사 (to watch, to ride) */
      const toVerb = w==="to" && ["want","wants","wanted","like","likes","liked","love","loves","need","needs","have","has","going","try","tries","hope","plan","decide","learn","learned","start","began","how","ready","able","time","way","nice","fun","easy","hard","good","great"].includes(prev);
      const fixed=toVerb || PREP_OK.has(w+" "+nn) || (w==="by" && (TRANSPORT.has(nn)||nn==="hand")) || (w==="to" && VSET.has(nn) && !["go","goes","went","going","come","comes","came","walk","walked","get","got","talk","talked","give","gave","gives","belong","belongs","next","close","listen","listened","said","say","write","wrote","send","sent","went"].includes(prev)) || nounNum(after)==="pl" || (nounNum(after) && !["today","yesterday","tomorrow","tonight","every","now","then","again","too","here","there"].includes(after) && !G_FUNC.has(after) && !G_BE.has(after) && !verbForms(after).some(v=>v.form==="s"||v.form==="past"));
      if(COUNT_NOUNS.has(nn) && !/^[A-Z]/.test(T[j]||"") && !afterNoun && !fixed && after!=="ing" && !/ing$/.test(nn)){
        const from=T.slice(i,j+1).join(" "); const adj=T.slice(i+1,j).join(" ");
        const pre=T[i]+" "+(adj?adj+" ":"");
        let to;
        if(["moon","sun","sky","earth","world"].includes(nn) || ART_PLACES.has(nn)) to=`${pre.replace(/ $/,"")} the ${adj?adj+" ":""}${T[j]}`.replace(/\s+/g," ");
        else { const a=/^[aeiou]/.test(adj||nn)?"an":"a"; to=`${T[i]} ${a} ${adj?adj+" ":""}${T[j]}</span> / <span class="en">${esc(pre+inflect(nn,"s"))}`; }
        out.push({title:ART_PLACES.has(nn)?"장소 앞에는 the를 써요":"하나는 a, 여럿은 -s를 붙여요",detail:`<span class="en">${esc(from)}</span> → <span class="en">${to}</span>`});
      }
    }
    /* 문장 처음: Dog is cute. → A dog is / Dogs are */
    if(i===0 && COUNT_NOUNS.has(w) && /^[A-Z]/.test(T[0]) && ["is","was","can","likes","has","looks","eats","lives","runs"].includes(n1))
      out.push({title:"하나는 a, 여럿은 -s를 붙여요",detail:`<span class="en">${esc(T[0]+" "+T[1])}</span> → <span class="en">${esc((/^[aeiou]/.test(w)?"An ":"A ")+w+" "+T[1])}</span>`});
    /* a/an + 셀 수 없는 말: a water → water */
    if((w==="a"||w==="an") && ART_UNCOUNT.has(n1) && ART_AFTER_OK.has(n2)) push(`${n1} 앞에는 a를 쓰지 않아요`,`${T[i]} ${T[i+1]}`,T[i+1]);
    /* a + 여러 개: a cookies → cookies */
    if((w==="a"||w==="an") && n1.length>3 && /s$/.test(n1) && !["few","lot","couple","little","bit","pair"].includes(n1)){
      const D=dictFor(unitNo);
      const sing=[n1.replace(/s$/,""),n1.replace(/es$/,""),n1.replace(/ies$/,"y")].find(x=>x!==n1 && D.set.has(x) && (inflect(x,"s")===n1 || x+"s"===n1));
      if(sing && !["news","lens","means","series","species","pants","jeans","glasses","scissors","shorts","clothes","sports","thanks"].includes(n1)) push("a 뒤에는 하나만 나타내는 말을 써요",`${T[i]} ${T[i+1]}`,`${T[i]} ${sing}`);
    }
  }
  return out;
}

  if(T.includes("i")) out.push({title:"'나'를 뜻하는 I는 항상 대문자예요", detail:`<span class="en">i</span> → <span class="en">I</span>`});
  for(let i=0;i<t.length;i++){
    const w=t[i], nx=t[i+1], nx2=t[i+2];
    if(nx && w===nx && !["had","that"].includes(w) && new RegExp("\\b"+w+"\\s+"+w+"\\b","i").test(sentence)) out.push({title:"같은 단어를 두 번 썼어요", detail:`<span class="en">${esc(T[i])} ${esc(T[i+1])}</span>`});
    if(w==="a" && nx && /^[aeiou]/.test(nx) && !AN_EXC.has(nx)) out.push({title:"a와 an을 확인해요", detail:`<span class="en">a ${esc(T[i+1])}</span> → <span class="en">an ${esc(T[i+1])}</span> (모음 소리 앞에는 an)`});
    if(w==="an" && nx && /^[^aeiou]/.test(nx) && !A_EXC.has(nx)) out.push({title:"a와 an을 확인해요", detail:`<span class="en">an ${esc(T[i+1])}</span> → <span class="en">a ${esc(T[i+1])}</span>`});
    if(nx){
      if(["am","is","are","was","were"].includes(w) && CORE_VERBS.has(nx) && !(nx==="like" && (!nx2 || ["a","an","the","this","that","these","those","my","your","his","her","our","their","me","you","him","us","them","it","he","she","we","they","one","two","three","some","what","that","so","magic","family","friends","brothers","sisters","home","heaven"].includes(nx2))) && !(nx==="have"&&false) && !["a","an","the"].includes(nx2||""))
        out.push({title:"be동사와 일반동사를 함께 썼어요", detail:`<span class="en">${esc(T[i])} ${esc(T[i+1])}</span> 중 하나만 써야 해요.`});
    }
    if(MODALS.has(w) || DO_AUX.has(w) || /'ll$/.test(w)){
      let j=i+1;
      if((DO_AUX.has(w)||G_MODAL.has(w)) && t[j] && SUBJ.has(t[j])) j++;
      if(t[j]==="not") j++;
      while(G_FREQ.has(t[j]||"") && w!=="to") j++;
      const x=t[j]||"";
      let b=null;
      if(x && w==="to"){ b=baseOf(x,t[i-1]||""); if(!b && TO_TRIGGER.has(t[i-1]||"")){ const f=verbForms(x).find(v=>v.form==="s"||v.form==="past"||v.form==="ing"); if(f && !verbForms(x).some(v=>v.form==="base") && (!nounNum(x) || f.form==="s" || f.form==="past" || (f.form==="ing" && (VDSET.has(f.base)||["the","a","an","my","your","his","her","our","their","me","him","us","them","it","with","to","at","in"].includes(t[j+1]||""))))) b=f.base; } }
      else if(x){
        /* 조동사 바로 뒤가 명사(주어)면 묻는 문장: Do plants need water? */
        const subjNoun=j===i+1 && (i===0 || /\?\s*$/.test(sentence)) && (nounNum(x)||nameLike(T,t,j)) && (verbForms(t[j+1]||"").some(v=>v.form==="base")||G_FREQ.has(t[j+1]||""));
        if(!subjNoun && !verbForms(x).some(v=>v.form==="base") && !G_BE.has(x)){ const f=verbForms(x).find(v=>v.form==="s"||v.form==="past"||v.form==="ing"||v.form==="pp"); if(f && !(f.form==="ing" && nounNum(x) && !VDSET.has(f.base) && i===0)) b=f.base; }
        if(!b && !subjNoun) b=baseOf(x);
        if(G_BE.has(x) && !(DO_AUX.has(w) && j>i+1)) b= DO_AUX.has(w) ? null : "be";
      }
      if(b && x) out.push({title:`${T[i]} 뒤에는 동사원형을 써요`, detail:`<span class="en">${esc(T[j])}</span> → <span class="en">${b}</span>`});
    }
  }
  return out;
}

function hasKo(s){ return /[가-힣]/.test(s); }
function josa(word,a,b){ const ch=word.trim().slice(-1); const c=ch.charCodeAt(0); if(c<0xAC00||c>0xD7A3) return b; return ((c-0xAC00)%28)?a:b; }

function tbNorm(s){
  let t=" "+String(s||"").toLowerCase().replace(/[’‘`]/g,"'")+" ";
  t=t.replace(/[.,?!"“”:;\[\]【】]/g," ");
  const pairs=[["it is","it's"],["i am","i'm"],["you are","you're"],["they are","they're"],["that is","that's"],["what is","what's"],["cannot","can't"],["can not","can't"],["do not","don't"],["did not","didn't"],["will not","won't"],["let us","let's"],["i will","i'll"]];
  for(const [a,b] of pairs) t=t.replace(new RegExp(" "+a+" ","g")," "+b+" ");
  return t.replace(/\s+/g," ").trim();
}
function tbExpand(p,slots){
  const m=p.match(/\{(\w+)\}/); if(!m) return [p];
  return (slots[m[1]]||[]).flatMap(v=>tbExpand(p.replace(m[0],v),slots));
}

const TB_FUNC = new Set("a an the to by at of in on for from with is are am was were it's i'm can will do does did be because and".split(" "));
let TB_CAT_RE=null, TB_CAT_OF=null;
function tbShape(n){
  if(!TB_CAT_RE){
    TB_CAT_OF=new Map(); Object.entries(TB_CATS).forEach(([c,ws])=>ws.forEach(w=>TB_CAT_OF.set(tbNorm(w),c)));
    const alts=[...TB_CAT_OF.keys()].sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
    TB_CAT_RE=new RegExp("(^| )("+alts.join("|")+")(?= |$)","g");
  }
  let prev, s=n;
  do{ prev=s; s=s.replace(TB_CAT_RE,(m,p,w)=>p+"§"+TB_CAT_OF.get(w)); }while(s!==prev);
  return s;
}
const TB_CACHE={};
function tb(unitNo){
  if(TB_CACHE[unitNo]) return TB_CACHE[unitNo];
  const src=TEXTBOOK[unitNo]; const slots=src.slots||{};
  const families=[];
  (src.families||[]).forEach(f=>families.push({q:f.q.flatMap(p=>tbExpand(p,slots)), a:f.a.flatMap(p=>tbExpand(p,slots))}));
  if(src.facts){
    const verbs=[...new Set(src.facts.map(f=>f[0]))];
    src.facts.forEach(([v,thing,people])=>families.push({q:[`Who ${v} ${thing}?`], a:people.map(p=>`${p} ${v} it.`)}));
    verbs.forEach(v=>families.push({q:[], a:slots.PERSON.map(p=>`${p} ${v} it.`), loose:true}));
  }
  if(src.seasonReasons){
    const qs=["What season do you like?","What season do you like, Carlos?","What season do you like, Kai?"];
    const as=[]; Object.entries(src.seasonReasons).forEach(([s,rs])=>{ as.push(`I like ${s}.`); rs.forEach(r=>as.push(`I like ${s} ${r}.`)); });
    families.push({q:qs, a:as});
  }
  const map=new Map();
  const addS=s=>{ const n=tbNorm(s); if(n && !map.has(n)) map.set(n,s); };
  families.forEach(f=>{ f.q.forEach(addS); f.a.forEach(addS); f.qn=new Set(f.q.map(tbNorm)); f.an=new Set(f.a.map(tbNorm)); });
  (src.extra||[]).flatMap(p=>tbExpand(p,slots)).forEach(addS);
  (src.frames||[]).forEach(addS);
  const bag=new Map(), shapes=new Map(), shapeBag=new Map();
  for(const [n,s] of map){
    const k=n.split(" ").sort().join(" "); if(!bag.has(k)) bag.set(k,s);
    const sh=tbShape(n); if(!shapes.has(sh)) shapes.set(sh,s);
    const sk=sh.split(" ").sort().join(" "); if(!shapeBag.has(sk)) shapeBag.set(sk,s);
  }
  const words=new Set(); for(const n of map.keys()) n.split(" ").forEach(w=>words.add(w));
  Object.values(TB_CATS).flat().forEach(w=>tbNorm(w).split(" ").forEach(x=>words.add(x)));
  const u=UNITS[unitNo]; u.words.concat(u.phrases).forEach(([en])=>tbNorm(en).split(" ").forEach(w=>words.add(w)));
  const known=new Set(words); words.forEach(w=>lemmaCandidates(w).forEach(x=>known.add(x)));
  return TB_CACHE[unitNo]={map,bag,shapes,shapeBag,families:families.filter(f=>!f.loose),words,known};
}
/* 글자 두 개가 자리를 바꾼 실수(bsu → bus)도 한 번으로 셈 */
function osa(a,b){
  const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0); r[0]=i; return r;});
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function tbClosest(w,T){
  if(w.length<3) return null; const lim=w.length<=4?1:2; let bw=null,b=lim+1;
  for(const x of T.words){ if(x.length<3 || Math.abs(x.length-w.length)>lim) continue; const dd=osa(w,x); if(dd<b){b=dd;bw=x;} }
  return b<=lim?bw:null;
}

function tbFactNote(sent,unitNo){
  const src=TEXTBOOK[unitNo]; if(!src.facts) return null;
  const m=tbNorm(sent).match(/^(.+) (painted|built|invented|made|wrote) (.+)$/); if(!m) return null;
  const f=src.facts.find(([v,thing])=>v===m[2] && tbNorm(thing)===m[3]); if(!f) return null;
  if(f[2].some(p=>tbNorm(p)===m[1])) return null;
  if(!src.slots.PERSON.some(p=>tbNorm(p)===m[1])) return null;
  return `${f[2][0]} ${f[0]} ${f[1]}.`;
}
function tokLev(a,b){
  const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
/* 교과서와 비교한 결과
   ok 같은 문장 / pattern 교과서 문장 틀에 맞음 / order 순서 / spell 철자 / unknown 교과서에 없는 단어
   missing·extra·swap 빠지거나 더 들어가거나 바뀐 작은 말 / novel 판단할 수 없는 새 문장 */
function tbSentence(s,unitNo){
  const T=tb(unitNo); const n=tbNorm(s); if(!n) return {kind:"novel"};
  if(T.map.has(n)) return {kind:"ok",ref:T.map.get(n)};
  const sh=tbShape(n);
  if(T.shapes.has(sh)) return {kind:"pattern",ref:T.shapes.get(sh)};
  const toks=n.split(" ");
  const key=[...toks].sort().join(" ");
  if(T.bag.has(key)) return {kind:"order",ref:T.bag.get(key)};
  const shToks=sh.split(" ");
  const sk=[...shToks].sort().join(" ");
  if(T.shapeBag.has(sk)) return {kind:"order",ref:T.shapeBag.get(sk)};
  const closest=w=>tbClosest(w,T);
  const unknown=toks.filter(w=>!isKnown(w,T.known) && !/^\d+$/.test(w));
  if(unknown.length){
    const diffs=unknown.map(w=>[w,closest(w)]);
    if(diffs.every(([w,c])=>c)) return {kind:"spell",diffs};
    return {kind:"unknown",diffs};
  }
  let best=null,bd=99;
  for(const [k,disp] of T.shapes){ const t2=k.split(" "); if(Math.abs(t2.length-shToks.length)>2) continue; const dd=tokLev(shToks,t2); if(dd<bd){bd=dd;best={disp,t2};} }
  if(best && bd===1){
    const a=shToks, b=best.t2;
    const without=(arr,i)=>arr.slice(0,i).concat(arr.slice(i+1)).join(" ");
    if(b.length===a.length+1){ for(let i=0;i<b.length;i++) if(without(b,i)===a.join(" ") && TB_FUNC.has(b[i])) return {kind:"missing",word:b[i],ref:best.disp}; }
    if(a.length===b.length+1){ for(let i=0;i<a.length;i++) if(without(a,i)===b.join(" ") && TB_FUNC.has(a[i])) return {kind:"extra",word:a[i],ref:best.disp}; }
    if(a.length===b.length){ const i=a.findIndex((w,j)=>w!==b[j]); if(i>=0 && TB_FUNC.has(a[i]) && TB_FUNC.has(b[i])) return {kind:"swap",from:a[i],to:b[i],ref:best.disp}; }
  }
  return {kind:"novel",ref:best && bd<=2 ? best.disp : null};
}

/* 대화 짝: 질문(A)에 맞는 대답인지, 대답(B)에 맞는 질문인지 */
function tbFamiliesForQ(qs,unitNo){ const n=tbNorm(qs); return tb(unitNo).families.filter(f=>f.qn.has(n)); }
function tbFamiliesForA(as,unitNo){ const n=tbNorm(as); return tb(unitNo).families.filter(f=>f.an.has(n)); }
function tbIsAnswerTo(qs,as,unitNo){ const fs=tbFamiliesForQ(qs,unitNo); if(!fs.length) return null; const n=tbNorm(as); return fs.some(f=>f.an.has(n)); }
function tbIsQuestionFor(as,qs,unitNo){ const fs=tbFamiliesForA(as,unitNo); if(!fs.length) return null; const n=tbNorm(qs); return fs.some(f=>f.qn.has(n)); }

function dialogLines(q){
  const A=q.match(/(?:^|\n)\s*A\s*:\s*(.*)/), B=q.match(/(?:^|\n)\s*B\s*:\s*(.*)/);

}

const DICT_CACHE={};
function dictFor(unitNo){
  if(DICT_CACHE[unitNo]) return DICT_CACHE[unitNo];
  const set=new Set([...BASE_WORDS,...EXTRA_WORDS,...ELEM_WORDS,...PROPER.keys()]);
  const big=LEX_WORDS.split(" ");
  Object.keys(UNITS).forEach(n=>{ unitStrings(UNITS[n]).forEach(s=>tokens(s).forEach(t=>set.add(t.toLowerCase()))); if(TEXTBOOK[n]) tb(+n).words.forEach(w=>set.add(w)); });

  const list=[...set].filter(w=>w.length>=3);
  const list2=big.filter(w=>w.length>=3 && !set.has(w));
  Object.entries(IRR_V).forEach(([b,f])=>{ set.add(b); set.add(f.past); set.add(f.pp); });
  const core=new Set(set); const rank=new Map(); big.forEach((w,i)=>rank.set(w,i));

}
function dictClosest(w,D){

  for(const x of D.list){ if(Math.abs(x.length-w.length)>lim) continue; const dd=osa(w,x); if(dd<b){b=dd;bw=x;} }
  if(b>1) for(const x of (D.list2||[])){ if(Math.abs(x.length-w.length)>lim) continue; const dd=osa(w,x); if(dd<b){b=dd;bw=x; if(b===1) break;} }
  return b<=lim?bw:null;
}
/* -er, -est, -ing, -ed, -s를 붙일 때의 철자 규칙 */
function syllables(w){ return (w.match(/[aeiouy]+/g)||[]).length - (/[^aeiou]e$/.test(w)&&w.length>3?1:0); }
function doubles(b){ return syllables(b)<=1 && /[^aeiou][aeiou][bcdfgklmnprstvz]$/.test(b); }

  if(s==="er"||s==="est"){ if(/e$/.test(b)) return b+s.slice(1); if(/[^aeiou]y$/.test(b)) return b.slice(0,-1)+"i"+s; if(doubles(b)) return b+b.slice(-1)+s; return b+s; }
  if(s==="ing"){ if(/ie$/.test(b)) return b.slice(0,-2)+"ying"; if(/[^eoy]e$/.test(b)) return b.slice(0,-1)+"ing"; if(doubles(b)) return b+b.slice(-1)+"ing"; return b+"ing"; }
  if(s==="ed"){ if(/e$/.test(b)) return b+"d"; if(/[^aeiou]y$/.test(b)) return b.slice(0,-1)+"ied"; if(doubles(b)) return b+b.slice(-1)+"ed"; return b+"ed"; }
  if(s==="s"){ if(/(s|x|z|ch|sh)$/.test(b)) return b+"es"; if(/[^aeiou]y$/.test(b)) return b.slice(0,-1)+"ies"; return b+"s"; }
  return b+s;
}

    const coreB=[...bases].filter(b=>b.length>=2 && D.core && D.core.has(b) && (VSET.has(b)||IRR_V[b]||ASET.has(b)||SHORT_ADJ.has(b)||suf==="s"));

/* 어미가 그 낱말에 붙을 수 있는지: -ed/-ing은 동사, -est는 형용사, -er은 형용사·동사 */
function sufPOS(b,suf){
  const v=VSET.has(b)||IRR_V[b]||VERBS.has(b), a=ASET.has(b)||SHORT_ADJ.has(b)||ART_ADJ.has(b);
  if(suf==="ed"||suf==="ing") return v; if(suf==="est") return a; if(suf==="er") return a||v; if(suf==="s") return NSET.has(b) || CSET.has(b) || !G_FUNC.has(b) && !STOP.has(b) && !["who","what","where","when","why","how","you","yours","mine","ours"].includes(b); return true;

/* 사전에 있는 단어이거나, 사전 단어에 어미를 바르게 붙인 단어인지 */
function dictOK(lw,D){
  if(D.set.has(lw) || IRREGULAR[lw]) return true;
  const ap=lw.match(/^(.+?)('s|'re|'m|'ll|'ve|'d|n't|s')$/); if(ap && dictOK(ap[1],D)) return true;
  if(/n't$/.test(lw) && D.set.has(lw.slice(0,-3))) return true;
  for(const [suf,re] of [["ing",/ing$/],["est",/est$/],["er",/er$/],["ed",/ed$/],["s",/s$/]]){
    if(!re.test(lw)) continue;
    const stem=lw.replace(re,"");
    const bases=new Set([stem, stem+"e", stem.replace(/(.)\1$/,"$1"), stem.replace(/i$/,"y"), stem.replace(/ie$/,"y"), stem.replace(/y$/,"ie"), stem.replace(/e$/,"")]);
    if(suf==="s") bases.add(lw.replace(/es$/,"")), bases.add(lw.replace(/ies$/,"y"));
    for(const b of bases){
      if(b.length<2 || !D.set.has(b) || !sufPOS(b,suf)) continue;
      if(inflect(b,suf)===lw) return true;
      if(suf==="s" && /o$/.test(b) && (lw===b+"es"||lw===b+"s")) return true;
    }
  }
  /* 어미가 두 번 붙은 경우: swimmers, players */
  if(/s$/.test(lw) && lw.length>4){ const st=lw.replace(/ies$/,"y").replace(/s$/,""); if(st!==lw && /(er|ing)$/.test(st) && dictOK(st,D)) return true; }
  if(/(ness|less|ful|ment)$/.test(lw) && lw.length>6){ const b=lw.replace(/(ness|less|ful|ment)$/,""); if(!/[^aeiou]y$/.test(b) && (D.set.has(b)||D.set.has(b.replace(/i$/,"y"))||dictOK(b,D))) return true; }
  if(/ly$/.test(lw) && lw.length>4){ const b=lw.slice(0,-2); if(D.set.has(b)||D.set.has(b.replace(/i$/,"y"))||D.set.has(b+"le")||dictOK(b,D)||dictOK(b.replace(/i$/,"y"),D)) return true; }
  return false;
}
/* 철자·고유명사 대문자 점검 → 빨간 표시 */
function spellingIssues(text,unitNo){
  const D=dictFor(unitNo); const out=[]; const seen=new Set();
  const src=String(text||"").replace(/[A-Za-z]*_+[A-Za-z_]*/g,m=>" ".repeat(m.length));
  const re=/[A-Za-z]+(?:['’][A-Za-z]+)?/g; let m;
  while((m=re.exec(src))){
    const w=m[0].replace("’","'"); const lw=w.toLowerCase();
    if(seen.has(w)) continue; seen.add(w);
    if(lw.length===1) continue;
    if(/\d$/.test(src.slice(0,m.index))) continue; /* 2nd, 21st 같은 날짜 */
    const before=src.slice(0,m.index).replace(/\s+$/,"");
    const atStart=!before || /[.?!:\n(\[]$/.test(before);
    /* 대문자로 시작하는 사전에 없는 말: 문장 중간이면 이름, 문장 처음이면 뒤에 동사가 올 때 이름 */
    if(/^[A-Z]/.test(w) && !D.set.has(lw) && !WRONG_FORMS[lw] && !WRONG_PAST[lw]){
      if(!atStart && !dictOK(lw,D)) continue;
      if(atStart){
        let rest=src.slice(m.index+m[0].length);
        if(/^\s*,/.test(rest)) continue;
        let nxt=(rest.match(/^\s*([A-Za-z']+)/)||[])[1]||"";
        while(G_FREQ.has(nxt.toLowerCase()) || /ly$/.test(nxt) || ["himself","herself","meanwhile","then","too","also"].includes(nxt.toLowerCase())){ rest=rest.replace(/^\s*[A-Za-z']+/,""); nxt=(rest.match(/^\s*([A-Za-z']+)/)||[])[1]||""; }
        const nl=nxt.toLowerCase();
        if(G_BE.has(nl) || G_MODAL.has(nl) || ["has","had","does","did","and","or","doesn't","didn't","don't","isn't","wasn't","hasn't","won't","can't"].includes(nl) || /^'s/.test(rest.trim()) || verbForms(nl).some(v=>v.form==="s"||v.form==="past")){
          /* 이름처럼 보여도 긴 단어와 한 글자만 다르면 철자 실수로 봄 (Libary is → Library) */

          if(!(s1 && s1.length>=6 && osa(lw,s1)===1 && (s1.length===lw.length+1 || swap))) continue;
        }
      }
    }
    const badInf=badInflection(lw,D);
    if(badInf){ out.push({title:"철자를 고쳐요",detail:`<span class="en">${esc(w)}</span> → <span class="en">${esc(/^[A-Z]/.test(w)?badInf[0].toUpperCase()+badInf.slice(1):badInf)}</span>`}); continue; }
    if(dictOK(lw,D)){
      const proper=PROPER.get(lw);
      const prevW=(src.slice(0,m.index).match(/([A-Za-z]+)\s*$/)||[])[1]||"";
      if(proper && w===lw && !(["march","china","may","turkey","polish","august"].includes(lw) && /^(the|a|an|to|will|may|can|of)$/i.test(prevW))) out.push({title:"고유명사는 대문자로 시작해요",detail:`<span class="en">${esc(w)}</span> → <span class="en">${esc(proper)}</span>`});
      continue;
    }
    const sug=dictClosest(lw,D);
    if(/^[A-Z]/.test(w) && !(atStart && sug)) continue; /* 사람·장소 이름 */
    if(/^[A-Z]/.test(w) && (/'s$/.test(w) || /^[A-Z]{2,}$/.test(w))) continue;
    if(/^[A-Z]/.test(w) && atStart){
      /* 문장 처음의 이름: 뒤에 동사가 오면 사람 이름으로 봄 (Hana is ~, Minji likes ~) */
      if(osa(lw,sug)>1) continue;
    }
    out.push({title:"철자를 고쳐요",detail: sug
      ? `<span class="en">${esc(w)}</span> → <span class="en">${esc(/^[A-Z]/.test(w)?sug[0].toUpperCase()+sug.slice(1):sug)}</span>`
      : `<span class="en">${esc(w)}</span>는 사전에 없는 단어예요. 철자를 확인해요. 사람이나 장소 이름이면 대문자로 시작해요.`});
  }
  return out;
}

  const joinLetters = s => String(s||"").replace(/\b[A-Za-z](?:\s*[\s,\/\-·]\s*[A-Za-z]\b){2,}/g, m=>m.replace(/[^A-Za-z]/g,""));
  const isPhrase=s=>(d.area==="phrase"||d.area==="word") && !/[.?!]\s*$/.test(s.trim());
  const BLANK_TOK=/(^|\s)(_{2,}|\(\s*\)|□)(?=\s|[.?!,]|$)/;
  const fillBlank=(seg,x)=>{ let a=x.trim(); if(!/^(_{2,}|\(\s*\)|□)/.test(seg.trim()) && /[.?!]$/.test(a) && /[.?!]$/.test(seg)) a=a.replace(/[.?!]+$/,""); return seg.replace(BLANK_TOK,(m,p)=>p+a).replace(/\s+/g," ").trim(); };
  const num=i=>"보기 "+"①②③④"[i];

  /* 1. 문제 모양 */
  if(!q) add("fix","문제","문제가 비어 있어요","문제 칸에 친구에게 낼 문제를 써 주세요.");
  else {
    /* 친구가 무엇을 해야 하는지 알 수 있게 끝까지 썼는지: 물음표, 빈칸, 괄호 고르기, 또는 '~세요/~시오/~다' 같은 끝맺음 */
    const hasTask=/\?/.test(q) || BLANK_RE.test(q) || /[A-Za-z]_|_[A-Za-z]/.test(q) || /\([^()]*\/[^()]*\)/.test(q) || /(요|다|오|까|니|죠)(?=[\s.?!~)\]」>]|$)/m.test(q) || /^\s*(choose|circle|write|find|fill|match|pick|select|complete|put|unscramble|translate|answer|correct|change|make|read|look|guess|spell|listen|underline|use)\b[^.!]*\s\S+\s\S+[^.!]*[.!:]/im.test(q) || /^\s*(unscramble|rearrange|arrange|translate|spell|answer)\s*[:.!]/im.test(q);
    /* 한글 지시문에는 할 일을 나타내는 말이 있어야 함 */
    const TASK_WORDS=/\b(choose|circle|write|find|fill|match|pick|select|which|what|who|where|when|why|how|complete|put|unscramble|translate|answer|correct|change|make|read|look|guess|spell)\b|쓰세요|쓰시오|쓰십시오|써\s*(보세요|주세요|봅시다)|쓰기|고르|골라|답하|대답|고치|고쳐|배열|완성|채우|채워|넣으|넣어|찾아|찾으|알맞|바르게|바른|틀린|어색|무엇|무슨|어느|누구|누가|언제|어디|왜|어떻게|몇|뜻|의미|영어로|우리말|말해|읽고|맞혀|맞춰|연결|번역|정답|것은|말은|것을|일까|인가요|나요|할까|해요\?|니\?/i;
    const koText=q.replace(/\[[^\]]*\]|【[^】]*】|「[^」]*」|<[^>]*>|'[^']*'|‘[^’]*’|"[^"]*"|“[^”]*”/g," ");
    if(q.replace(/\s/g,"").length<6) add("fix","문제","문제가 너무 짧아요","친구가 풀 수 있게 문제를 끝까지 써 주세요.");
    else if(hasKo(q) && !TASK_WORDS.test(q)) add("fix","문제","무엇을 하라는 문제인지 써요","'쓰세요', '고르세요', '알맞은 것은?'처럼 친구가 할 일을 써 주세요.");
    else if(!hasTask) add("fix","문제","문제를 끝까지 써요","'~을 쓰세요.', '~은?'처럼 친구가 무엇을 해야 하는지 써 주세요.");
    else if(/다음(?!\s*중)/.test(q)){
      /* '다음 ~'이라고 했는데 그 뒤에 단어나 문장이 없음 */
      const m=q.match(/^[\s\S]*?(요|오|다|까|니|죠)[.?!:~]*(?=[\s:]|$)/) || q.match(/^[\s\S]*?[.?!]+/);
      const rest=m ? q.slice(m[0].length).replace(/[\s\[\]【】「」<>()'"‘’“”:~!.?*※▶◀★#-]/g,"") : "";
      if(m && !rest) add("fix","문제","'다음'에 오는 내용이 없어요","지시문 아래에 친구가 볼 단어나 문장을 써 주세요.");
    }
  }
  if(q && /빈칸/.test(q) && !BLANK_RE.test(q) && !/[A-Za-z]_|_[A-Za-z]|(^|\s)_(\s|$)/.test(q)) add("fix","문제","빈칸 표시가 없어요","빈칸이 들어갈 자리에 ____ 처럼 밑줄을 넣어 주세요.");
  if(isMC){
    if(filled.length<3) add("fix","보기","보기가 부족해요","보기를 3개 이상 써 주세요.");
    const low=filled.map(x=>x.o.toLowerCase().replace(/\s+/g," "));
    if(new Set(low).size<low.length) add("fix","보기","똑같은 보기가 있어요","보기는 모두 달라야 해요. 겹치는 보기를 바꿔 주세요.");
    if(d.correct==null) add("fix","정답","정답 보기를 표시하지 않았어요","정답인 보기 옆의 '정답' 버튼을 눌러 주세요.");
    else if(!corr) add("fix","정답","정답으로 고른 칸이 비어 있어요","정답 칸에 보기를 쓰거나, 다른 보기를 정답으로 골라 주세요.");
  } else if(!ans) add("fix","정답","정답이 비어 있어요","정답 칸에 정답을 써 주세요.");

  /* 한글 자음·모음만 있는 글자 (ㄴㅇ 같은 잘못 누른 글자) */
  const jamo=(text,where)=>{ const m=String(text||"").match(/[ㄱ-ㅎㅏ-ㅣ]+/g); if(m) add("fix",where,"자음·모음만 쓴 글자가 있어요",`<b>${esc([...new Set(m)].slice(0,3).join(", "))}</b> 부분을 다시 써 주세요.`); };
  jamo(q,"문제");
  if(isMC) filled.forEach(x=>jamo(x.o,num(x.i))); else jamo(ans,"정답");

  /* 2. 정답이 문제 형식에 맞는지 */
  const scramble=q.match(/\(([^()]*\/[^()]*\/[^()]*)\)/);
  const choice=!scramble && q.match(/\(\s*([^()\/]+?)\s*\/\s*([^()\/]+?)\s*\)/);
  const engAns=ans && /[A-Za-z]/.test(ans) && !hasKo(ans);
  const wrongSeg=grammarErrQ ? englishSegments(q).find(s=>sentenceLike(s)) : null;
  let filledSentence=null;
  if(engAns){
    if(!scramble && scrambleQ && d.area!=="word" && ans && wordCount(ans)>=3){
      const segs=joinLetters(q).split(/\n|(?<=[:])\s*/).map(s=>s.replace(/[\[\]()]/g," ").trim()).filter(s=>/[A-Za-z]/.test(s) && !hasKo(s) && !SCR_INSTR.test(s));
      const seg=segs.sort((a,b)=>wordCount(b)-wordCount(a))[0];
      if(seg && wordCount(seg)>=3){
        const given=seg.split(/[\/,]/).flatMap(p=>tbNorm(p).split(" ")).filter(Boolean).sort();
        const used=tbNorm(ans).split(" ").filter(Boolean).sort();
        if(given.join(" ")!==used.join(" ")) add("fix","정답","주어진 단어를 모두 한 번씩만 써야 해요",`주어진 단어: ${en(seg)}`);
      }
    }
    if(scramble){
      const given=scramble[1].split("/").flatMap(p=>tbNorm(p).split(" ")).filter(Boolean).sort();
      const used=tbNorm(ans).split(" ").filter(Boolean).sort();
      if(given.join(" ")!==used.join(" ")) add("fix","정답","주어진 단어를 모두 한 번씩만 써야 해요",`주어진 단어: ${en(scramble[1].trim())}`);
    }
    if(choice && !isMC && ![choice[1],choice[2]].some(o=>tbNorm(o)===tbNorm(ans)))
      add("fix","정답","괄호 안의 말 중 하나를 정답으로 써요",`${en(choice[1])} 또는 ${en(choice[2])}`);
    const mask=q.split(/\s+/).find(t=>/^[A-Za-z_]{3,}$/.test(t) && /_/.test(t) && /[A-Za-z]/.test(t) && !/_{2,}/.test(t));
    if(mask && !sentenceLike(ans) && !new RegExp("^"+mask.replace(/_/g,"[A-Za-z]")+"$","i").test(ans.replace(/\s+/g,"")))
      add("fix","정답","빈칸 글자와 정답이 맞지 않아요",`${en(mask)} ↔ ${en(ans)}`);
    if(grammarErrQ && /→|->/.test(ans) && wrongSeg){
      const [x,y]=ans.split(/→|->/).map(t=>t.trim());
      const re=new RegExp("(^|[^A-Za-z'])"+escRe(x)+"(?=[^A-Za-z']|$)","i");
      if(!x || !re.test(wrongSeg)) add("fix","정답","고칠 말이 문제 문장에 없어요",`문제 문장: ${en(wrongSeg)}`);
      else filledSentence=wrongSeg.replace(re,(m,p)=>p+y);
    }
    if(!filledSentence){
      const seg=englishSegments(q).find(s=>BLANK_TOK.test(s) || (choice && s.includes(choice[0])));
      if(seg) filledSentence = BLANK_TOK.test(seg) ? fillBlank(seg,ans) : seg.replace(choice[0],ans);
    }
    if(filledSentence && !sentenceLike(filledSentence)) filledSentence=null;
  }

  /* 3. 철자·대소문자·문장부호·문법 */
  const checkText=(text,where,o)=>{
    if(!text || !/[A-Za-z]/.test(text)) return;
    if(o.spell!==false) spellingIssues(text,unitNo).forEach(x=>{
      const bad=(x.detail.match(/<span class="en">([^<]+)<\/span>/)||[])[1];
      if(where==="문제" && anagramOf && bad && sortL(bad)===anagramOf) return;
      add("fix",where,x.title,x.detail);
    });
    /* 두 단어 문장: Its fine. / Your welcome. */
    if(o.grammar!==false) englishSegments(text).filter(s=>wordCount(s)===2 && /[.!?]$/.test(s.trim())).forEach(s=>{
      const m=s.trim().match(/^(its|your)\s+([a-z]+)/i); if(!m) return;
      const w2=m[2].toLowerCase();
      if(m[1].toLowerCase()==="its" && (ASET.has(w2)||SHORT_ADJ.has(w2)||["ok","okay","me","you","raining","snowing","fine"].includes(w2)) && w2!=="own") add("fix",where,"'그것은 ~이다'는 It's예요",`${en(m[1])} → ${en(m[1][0]+"t's")}`);
      if(m[1].toLowerCase()==="your" && ["welcome","right","wrong","kidding","late","amazing","awesome","beautiful","smart","kind","funny"].includes(w2)) add("fix",where,"'너는 ~이다'는 You're예요",`${en(m[1])} → ${en(m[1][0]+"ou're")}`);
    });
    if(!o.sentence){
      if(o.grammar!==false && !intentionalQ && wordCount(text)>=2 && !hasKo(text)) articleIssues(text,unitNo).forEach(x=>add("fix",where,x.title,x.detail));
      return;
    }
    const sents=englishSegments(text).filter(s=>sentenceLike(s) && !s.includes("/") && !/[A-Za-z]_|_[A-Za-z]/.test(s) && !isPhrase(s));
    sents.forEach(s=>{
      sentenceChecks(s).forEach(x=>add("fix",where,x.title,x.detail));
      if(o.grammar===false || BLANK_TOK.test(s)) return;
      const gi=grammarIssues(s,unitNo,q+"\n"+text);
      gi.forEach(x=>add("fix",where,x.title,x.detail));
      if(gi.length) return;
      const r=tbSentence(s,unitNo);
      if(r.kind==="order") add("fix",where,"단어 순서를 확인해요",`교과서: ${en(r.ref)}`);
      else if(r.kind==="missing") add("fix",where,`'${r.word}'가 빠졌어요`,`'${esc(r.word)}'를 넣어야 해요. 교과서: ${en(r.ref)}`);
      else if(r.kind==="extra") add("fix",where,`'${r.word}'는 빼야 해요`,`교과서: ${en(r.ref)}`);
      else if(r.kind==="swap") add("fix",where,`'${r.from}' 대신 '${r.to}'를 써요`,`교과서: ${en(r.ref)}`);
    });
  };
  /* 문제 */
  if(q){
    const qText = grammarErrQ && wrongSeg ? q.replace(wrongSeg," ") : q;
    if(scrambleQ){
      /* 지시문만 문장으로 보고, 섞어 놓은 부분은 철자 점검도 하지 않음 */
      const lines=joinLetters(qText).split(/\n|(?<=[.!:])\s+/);
      lines.forEach(s=>{ if(!/[A-Za-z]/.test(s)) return; if(SCR_INSTR.test(s) || hasKo(s)) checkText(s.replace(/[:]\s*[A-Za-z ,\/\-·()\[\]]*$/,".").replace(/:\s*$/,"."),"문제",{sentence:true}); });
      /* 섞은 글자가 정답과 같은 글자인지 */
      if(anagramOf && d.area==="word"){
        const cands=tokens(joinLetters(qText)).filter(w=>/^[A-Za-z]+$/.test(w) && Math.abs(w.length-ans.length)<=1 && w.length>=3 && !SCR_INSTR.test(w) && !["word","words","letters","sentence","the"].includes(w.toLowerCase()));
        if(cands.length && !cands.some(w=>sortL(w)===anagramOf) && cands.length===1 && !dictOK(cands[0].toLowerCase(),dictFor(unitNo)))
          add("fix","문제","섞은 글자와 정답의 글자가 달라요",`${en(cands[0])} ↔ ${en(ans)}`);
      }
    } else checkText(qText,"문제",{sentence:true});
  }
  /* 정답 */
  if(filledSentence) checkText(filledSentence, "정답을 넣은 문장", {sentence:true});
  if(engAns){
    const same = filledSentence && tbNorm(filledSentence)===tbNorm(ans);
    if(wrongPickQ) checkText(ans, num(d.correct)+" (정답)", {sentence:sentenceLike(ans) && !isPhrase(ans), grammar:false, spell:false});
    else if(!same && !(grammarErrQ && /→|->/.test(ans))) checkText(ans, isMC?num(d.correct)+" (정답)":"정답", {sentence:sentenceLike(ans) && !isPhrase(ans)});
    else if(grammarErrQ && /→|->/.test(ans)) checkText(ans.split(/→|->/)[1]||"", "정답", {sentence:false});
  }
  /* 오답 보기: 철자·문법을 일부러 틀리게 만들 수 있으니 점검하지 않음 */
  if(isMC) filled.forEach(x=>{
    if(x.i===d.correct || hasKo(x.o)) return;
    if(wrongPickQ){ checkText(x.o, num(x.i), {sentence:sentenceLike(x.o) && !isPhrase(x.o)}); return; }
    /* 오답 보기는 일부러 틀리게 만들 수 있으니 철자·대소문자·마침표를 보지 않음 (libary, i like 같은 함정) */
    return;
  });

  /* 4. 통과 */
  const nFix=items.filter(x=>x.lvl==="fix").length;
  if(q && !nFix){
    add("good","점검","철자와 문법을 모두 통과했어요", engAns ? `정답: ${en(filledSentence||ans)}` : "");
    const vocab=unitVocab(UNITS[unitNo]);
    const used=[...new Set(tokens([q,ans,...filled.map(x=>x.o)].join(" ")).map(w=>w.toLowerCase()).filter(w=>w.length>2 && lemmaCandidates(w).some(c=>vocab.has(c))))];
    if(used.length) add("good","단원",`${unitNo}단원에서 배운 말을 썼어요`,en(used.slice(0,6).join(", ")));
  }

  /* 5. 친구 생각해 보기 */
  if(isMC){
    if(d.trap==null) add("fix","친구 생각","친구가 속을 것 같은 보기를 골라 주세요","'친구 생각해 보기'에서 보기 번호를 눌러 주세요.");
    else if(d.trap===d.correct) add("fix","친구 생각","정답은 속는 보기가 될 수 없어요","정답이 아닌 보기 중에서 골라 주세요.");
    else if(!(d.options[d.trap]||"").trim()) add("fix","친구 생각",`${"①②③④"[d.trap]} 보기 칸이 비어 있어요`,"보기를 쓰거나 다른 보기를 골라 주세요.");
  }
  if(d.trapReason==null) add("fix","친구 생각", isMC?"친구가 왜 속을지 이유를 골라 주세요":"친구가 어디서 틀릴지 골라 주세요","'친구 생각해 보기'에서 골라 주세요.");

  const order={fix:0,good:1};
  items.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  return {items, diff:difficulty(d), filledSentence};
}

function difficulty(d){
  const q=d.question||""; const isMC=d.type==="mc"; let s=0; const why=[]; const up=[], down=[];
  const hint=/힌트|hint|첫\s*글자|[A-Za-z]_|_[A-Za-z]/i.test(q);
  if(isMC){ s+=1; why.push("보기에서 고르는 객관식이에요."); } else { s+=2; why.push("답을 직접 쓰는 주관식이에요."); }
  if(d.area==="phrase"){ s+=.5; why.push("두세 단어로 된 어구를 알아야 해요."); }
  if(d.area==="sentence"||d.area==="grammar"){ s+=1; why.push(d.area==="grammar"?"문장 규칙을 생각해야 해요.":"문장 전체를 이해해야 해요."); }
  if(isMC){
    const filled=(d.options||[]).map((o,i)=>({o:(o||"").trim(),i})).filter(x=>x.o);
    if(filled.length>=4){ s+=.5; why.push("보기가 4개라 고르기가 더 어려워요."); down.push("보기를 3개로 줄여 보세요."); }
    else up.push("보기를 4개로 늘려 보세요.");
    const c=d.correct!=null?(d.options[d.correct]||"").trim():"";
    const sim=c && /^[A-Za-z]/.test(c) && filled.some(x=>x.i!==d.correct && /^[A-Za-z]/.test(x.o) && lev(x.o,c)<=2);
    if(sim){ s+=.5; why.push("정답과 철자가 비슷한 보기가 있어서 헷갈려요."); down.push("정답과 너무 비슷한 보기를 덜 헷갈리는 것으로 바꿔 보세요."); }
    else {
      if(d.trap!=null && d.trapReason!=null){ s+=.5; why.push("친구가 속을 만한 보기를 넣었어요."); }
      up.push("정답과 철자나 모양이 비슷한 보기를 넣어 보세요.");
    }
    up.push("주관식으로 바꿔 보세요.");
  } else {
    const a=(d.answer||"").trim(); const n=tokens(a).length;
    if(n>=3){ s+=1; why.push("정답이 여러 단어라서 길어요."); down.push("답을 더 짧은 단어나 어구로 바꿔 보세요."); }
    else {
      if(n>=1 && a.replace(/[^A-Za-z]/g,"").length>=7){ s+=.5; why.push("철자가 긴 단어를 써야 해요."); }
      up.push(d.area==="word"?"어구나 문장을 묻는 문제로 바꿔 보세요.":"답을 문장으로 쓰게 해 보세요.");
    }
    if(hint){ s-=1; why.push("힌트가 있어서 쉬워져요."); up.unshift("힌트를 빼 보세요."); }
    else if(q.includes("/")){ s-=.5; why.push("쓸 단어가 주어져서 조금 쉬워져요."); up.unshift("주어진 단어를 빼고 직접 쓰게 해 보세요."); }
    else down.push("첫 글자 힌트를 주세요. 예: (힌트: 첫 글자는 b)");
    down.push("객관식으로 바꿔 보세요.");
  }
  const level = s<=1.5?0 : s<=2.5?1 : 2;
  return {level, name:["쉬움","보통","어려움"][level], why, up:up.slice(0,2), down:down.slice(0,2)};
}


function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
if(typeof module!=="undefined") module.exports={tb,tbSentence,tbNorm,UNITS,review,difficulty,spellCheck,grammarIssues,englishSegments,knownSet,unitVocab};
</script>

<script id="ui">
const KEY="quiz-card-maker-v1";
const newDraft=()=>({type:null,area:null,goal:null,target:null,question:"",options:["","","",""],correct:null,answer:"",trap:null,trapReason:null});

  document.getElementById("steps").innerHTML=S.step==="start"?"":names.map((n,i)=>{

/* ============================================================
   문제 유형 살펴보기: 고른 단원의 교과서 자료로 예시를 만듦
   ============================================================ */
function scrambleLetters(w){
  const a=w.split(""); const n=a.length;
  let out=a.map((_,i)=>a[(i*3+1)%n]); /* 늘 같은 순서로 섞음 */
  if(new Set(out).size<new Set(a).size || out.join("")===w) out=a.slice().reverse();
  if(out.join("")===w) out=a.slice(1).concat(a[0]);
  return out.join("");
}
function scrambleWords(sentence){
  const end=(sentence.match(/[.?!]$/)||[""])[0];
  const ws=sentence.replace(/[.?!]$/,"").split(/\s+/);
  let out=ws.map((_,i)=>ws[(i*2+1)%ws.length]);
  if(new Set(out).size<ws.length || out.join(" ")===ws.join(" ")) out=ws.slice().reverse();
  return "( "+out.join(" / ")+(end?" / "+end:"")+" )";
}
function maskLetters(w){ return w.split("").map((c,i)=>i%2===1?"_":c).join(" "); }
function allDlFallback(units){ return units.flatMap(x=>x.dialogs)[0]; }

  const single=u.words.filter(([en])=>/^[a-z]{4,9}$/.test(en));

  const o1=others[0]||u.words[2], o2=others[1]||u.words[3];
  const ph=u.phrases.find(([en])=>/^[A-Za-z]+( [A-Za-z]+){1,3}$/.test(en))||u.phrases[0];
  const phWords=ph[0].split(" "); const phLast=phWords.pop();
  const lastOf=p=>p[0].replace(/[.?!]$/,"").split(" ").pop();
  const phOthers=u.phrases.filter(p=>p!==ph).map(lastOf).filter(x=>x.toLowerCase()!==phLast.toLowerCase()&&/^[A-Za-z]+$/.test(x));
  const d0=u.dialogs[0];
  const g0=u.grammar[0], g1=u.grammar[1]||u.grammar[0];
  const uniq=a=>[...new Set(a)];
  const otherUnits=Object.keys(UNITS).filter(k=>+k!==+unitNo).map(k=>UNITS[k]);

  const allDl=[...u.dialogs,...otherUnits.flatMap(x=>x.dialogs)];
  const ansPool=uniq(allDl.filter(x=>x.q!==d0.q && x.a!==d0.a).map(x=>x.a));

  return [

      ${chipGroup("lb-target","친구가 얼마나 생각하면 좋을까?","setTarget",TARGETS.map((t,i)=>[i,t[0],t[1]]),d.target)}

      <span class="hint">빈칸은 밑줄 ____ 로 표시해요.</span></div>`;
  if(d.type==="mc"){
    h+=`<div class="field"><span class="label">보기 <span class="hint">(3~4개, 정답 1개)</span></span>
      ${d.options.map((o,i)=>`<div class="opt"><span class="opt-num" aria-hidden="true">${"①②③④"[i]}</span>
        <input type="text" class="en-in" id="f-o${i}" aria-label="보기 ${i+1}" data-field="opt" data-i="${i}" value="${esc(o)}" placeholder="${i===3?"(4번은 써도 되고 안 써도 돼요)":""}" autocomplete="off">
        <button class="mark" data-act="setCorrect" data-i="${i}" aria-pressed="${d.correct===i}">${d.correct===i?"정답 ✓":"정답"}</button></div>`).join("")}</div>`;
  } else {
    h+=`<div class="field"><label class="label" for="f-a">정답</label><input id="f-a" type="text" class="en-in" data-field="answer" value="${esc(d.answer)}" autocomplete="off"></div>`;
  }
  h+=`</section><section class="panel fade think"><span class="label">친구 생각해 보기</span>`;

    h+=chipGroup("lb-trap","친구가 어떤 보기에 속을까?","setTrap",nums.map(i=>[i,`${"①②③④"[i]} 보기`,""]),d.trap);
  }
  const R=REASONS[d.type]; const allow=REASON_SET[d.area]||R.map((_,i)=>i);
  h+=chipGroup("lb-reason",d.type==="mc"?"왜 그 보기에 속을 것 같아?":"친구가 어디서 틀릴 것 같아?","setReason",allow.map(i=>[i,R[i][0],""]),d.trapReason==null?"":d.trapReason);

function optionLines(d){
  return d.type==="mc"?d.options.map((o,i)=>({o:o.trim(),i})).filter(x=>x.o):[];
}
function answerText(d){
  if(d.type==="mc"){ const f=optionLines(d); const k=f.findIndex(x=>x.i===d.correct); return k<0?"":`${"①②③④"[k]} ${f[k].o}`; }
  return d.answer.trim();
}
const DIFF_COLORS=["#3f8fb5","#4f5fc9","#7a45b8"];

/* ===== 피드백 화면: 내 문제를 그대로 보여 주고, 틀린 곳만 빨갛게 + 짧은 칩 ===== */
const plain=s=>String(s||"").replace(/<[^>]+>/g,"").replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
function chipOf(x){
  const arrow=x.detail.match(/<span class="en">([^<]+)<\/span>\s*→\s*<span class="en">([^<]+)<\/span>/);
  if(arrow) return {from:arrow[1], text:`${arrow[1]} → ${arrow[2]}`, en:true};
  const t=x.title, d=plain(x.detail);
  const word=(x.detail.match(/<span class="en">([^<]+)<\/span>/)||[])[1];
  if(/사전에 없는 단어/.test(d) && word) return {from:word, text:`${word} ← 철자 확인`, en:true};
  if(/마침표나 물음표가 없어요/.test(t)) return {text:"끝에 . 또는 ? 붙이기", end:true};
  if(/물음표로 끝나요/.test(t)) return {text:"끝을 ?로", end:true};
  const m=t.match(/^'(.+)'가 빠졌어요$/); if(m) return {text:`'${m[1]}' 넣기`, en:true};
  const m2=t.match(/^'(.+)'는 빼야 해요$/); if(m2) return {from:m2[1], text:`'${m2[1]}' 빼기`, en:true};
  const m3=t.match(/^'(.+)' 대신 '(.+)'를 써요$/); if(m3) return {from:m3[1], text:`${m3[1]} → ${m3[2]}`, en:true};
  const map=[[/자음·모음만/,"글자 다시 쓰기: "+((x.detail.match(/<b>([^<]+)<\/b>/)||[])[1]||"")],[/무엇을 하라는 문제인지/,"할 일 쓰기: ~쓰세요 / ~고르세요"],[/문제가 너무 짧아요/,"문제를 끝까지 쓰기"],[/문제를 끝까지 써요/,"할 일 쓰기: ~쓰세요. / ~은?"],[/'다음'에 오는 내용/,"'다음' 내용 쓰기"],[/단어 순서/,"단어 순서 다시"],[/문제가 비어/,"문제 쓰기"],[/정답이 비어/,"정답 쓰기"],[/보기가 부족/,"보기 3개 이상"],[/똑같은 보기/,"같은 보기 바꾸기"],
    [/정답 보기를 표시하지/,"정답 표시하기"],[/정답으로 고른 칸이 비어/,"정답 칸 채우기"],[/빈칸 표시가 없어요/,"빈칸 ____ 넣기"],[/주어진 단어를 모두/,"주어진 단어 모두 쓰기"],
    [/괄호 안의 말 중/,"괄호 속 말로 답하기"],[/빈칸 글자와 정답/,"빈칸 글자와 맞추기"],[/고칠 말이 문제 문장에 없어요/,"고칠 말 다시 보기"],
    [/속을 것 같은 보기를 골라/,"속을 보기 고르기"],[/이유를 골라|어디서 틀릴지/,"이유 고르기"],[/속는 보기가 될 수 없어요/,"정답 말고 다른 보기"],[/보기 칸이 비어 있어요/,"빈 보기 채우기"]];
  for(const [re,txt] of map) if(re.test(t)) return {text:txt};
  return {text:t};
}
function rowKey(where,d){
  if(/^문제/.test(where)) return "q";
  const m=where.match(/^보기 ([①②③④])/); if(m) return "o"+"①②③④".indexOf(m[1]);
  if(where==="보기") return "opts";
  if(where==="정답을 넣은 문장") return "filled";
  if(where==="정답") return d.type==="mc" ? (d.correct!=null?"o"+d.correct:"opts") : "a";
  if(where==="친구 생각") return "friend";
  return "q";
}
function markText(text,chips){
  let out=esc(text);
  chips.filter(c=>c.from).forEach(c=>{
    const f=esc(c.from).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp("(^|[^A-Za-z'])("+f+")(?=[^A-Za-z']|$)");
    if(re.test(out)) out=out.replace(re,(m,p,w)=>`${p}<mark class="err">${w}</mark>`);
  });
  if(chips.some(c=>c.end)) out+=`<span class="err-end" aria-hidden="true">●</span>`;
  return out;
}
function vFeedback(){
  const d=D(); const r=review(d,S.unit);
  const fixes=r.items.filter(x=>x.lvl==="fix");
  const nFix=fixes.length;
  const tgt=d.target, lv=r.diff.level, match=tgt===lv;
  const ansText=d.type==="mc" ? (d.correct!=null?(d.options[d.correct]||""):"") : d.answer;
  const sameFilled=!!r.filledSentence && tbNorm(r.filledSentence)===tbNorm(ansText);
  /* 정답을 빈칸에 넣은 문장의 실수는 정답 줄에 함께 보여 줌 */
  const ansKey=d.type==="mc" ? (d.correct!=null?"o"+d.correct:"opts") : "a";
  const rows={}; fixes.forEach(x=>{ const k=x.where==="정답을 넣은 문장"?ansKey:rowKey(x.where,d); (rows[k]=rows[k]||[]).push(chipOf(x)); });
  const filledBad=fixes.some(x=>x.where==="정답을 넣은 문장") && !sameFilled;
  const ctx=k=> (k===ansKey && filledBad) ? `<div class="fb-ctx">넣으면: <span class="en">${markText(r.filledSentence,rows[k]||[])}</span></div>` : "";
  const chipsHtml=k=>(rows[k]||[]).map(c=>`<span class="fix-chip${c.en?" en":""}">${esc(c.text)}</span>`).join("");
  const line=(k,label,text,extra)=>{
    const bad=!!rows[k];
    return `<div class="fb-row${bad?" bad":""}">
      <span class="fb-lab">${label}</span>
      <div class="fb-body"><div class="fb-text">${markText(text,rows[k]||[])}${extra||""}</div>${ctx(k)}${bad?`<div class="fix-chips">${chipsHtml(k)}</div>`:""}</div>
      <span class="fb-mark" aria-label="${bad?"고칠 곳 있음":"통과"}">${bad?"✗":"✓"}</span>
    </div>`;
  };
  let card=line("q","문제",d.question.trim()||" ");
  if(d.type==="mc"){
    d.options.forEach((o,i)=>{ if(!o.trim() && !rows["o"+i]) return; card+=line("o"+i,"①②③④"[i],o.trim(),d.correct===i?` <span class="ok-tag">정답</span>`:""); });
    if(rows.opts) card+=line("opts","보기","");
  } else card+=line("a","정답",d.answer.trim());
  if(rows.friend) card+=line("friend","친구 생각","");
  const msg = nFix ? `빨간 곳 <b>${nFix}개</b>만 고치면 돼!` : !match ? `철자·문법은 통과! 난이도만 목표와 달라.` : `통과! 완성해도 좋아.`;
  const sug=(lv<tgt?r.diff.up:r.diff.down).slice(0,2).map(t=>t.replace(/ 보세요\.$/,"요").replace(/\.$/,""));
  return bot(msg)+`
  <section class="status fade">
    <div class="st ${nFix?"st-bad":"st-ok"}"><span class="st-big">${nFix?"✗ "+nFix:"✓"}</span><span>${nFix?"고칠 곳":"철자·문법 통과"}</span></div>
    <div class="st ${match?"st-ok":"st-warn"}"><span class="st-big">${r.diff.name}</span><span>${match?"목표와 같아요 ✓":`목표는 '${TARGETS[tgt][1]}'`}</span></div>
  </section>
  <section class="panel fade fb-card">${card}</section>
  ${match||nFix?"":`<section class="panel fade diff-fix">
    <div class="diff-q">${lv<tgt?"더 어렵게":"더 쉽게"} 하려면</div>
    <div class="fix-chips">${sug.map(s=>`<span class="tip-chip">${esc(s)}</span>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-act="back">문제 고치기</button><button class="btn ghost" data-act="adoptTarget" data-v="${lv}">목표를 '${TARGETS[lv][1]}'으로</button></div>
  </section>`}
  <div class="row between"><button class="btn ghost" data-act="back">← 고치러 가기</button>
    <button class="btn" data-act="complete" ${nFix||!match?"disabled":""}>완성! →</button></div>`;
}

function thoughtHtml(d){
  const goal=(GOALS[d.area]||[]).find(g=>g[0]===d.goal);
  const R=REASONS[d.type]||[]; const reason=R[d.trapReason]?R[d.trapReason][1]:"";
  let trapLine="";
  if(d.type==="mc"){ const f=optionLines(d); const k=f.findIndex(x=>x.i===d.trap); trapLine=`친구가 속을 것 같은 보기: <span class="en">${k<0?"":esc("①②③④"[k]+" "+f[k].o)}</span> (${esc(reason)})`; }
  else trapLine=`친구가 틀릴 것 같은 곳: ${esc(reason)}`;
  return `<div class="thought"><div class="kicker">만든 사람의 생각</div><ul class="plain">
    <li>친구가 연습했으면 하는 것: ${esc(goal?goal[1]:"")}</li>
    <li>목표 난이도: ${esc(d.target!=null?TARGETS[d.target][0]:"")}</li>
    <li>${trapLine}</li></ul></div>`;
}
function quizBox(d,withAnswer){
  const df=difficulty(d); const unit=d.unit||S.unit; const opts=optionLines(d);
  return `<article class="qbox fade" aria-label="${esc(S.num)}번 문제">
      <div class="qbox-head"><span class="qno">${esc(S.num)}번 문제</span>
        <span class="qmeta"><span class="pill">${unit}단원</span><span class="diff-badge" style="background:${DIFF_COLORS[df.level]}">${df.name}</span></span></div>
      <div class="qtext">${esc(d.question.trim())}</div>
      ${opts.length?`<ol class="qopts">${opts.map((x,k)=>`<li><span class="onum">${"①②③④"[k]}</span>${esc(x.o)}</li>`).join("")}</ol>`:""}
      ${withAnswer?`<div class="qanswer"><span class="kicker">정답</span> ${esc(answerText(d))}</div>`:""}
    </article>`;
}
function vDone(){
  const d=S.drafts[1];
  return `<section class="final-head fade">
      <div class="final-name"><span class="final-no">${esc(S.num)}번</span> ${esc(S.name)}의 영어 퀴즈</div>
      <p style="margin:0">종이에 <b>문제 번호와 답</b>을 적어요. 예: <b>${esc(S.num)}번: ${d.type==="mc"?"②":"내가 생각한 답"}</b></p>
    </section>
    ${quizBox(d,false)}`;
}
function vAnswer(){
  const d=S.drafts[1];
  return `<section class="final-head answer-head fade">
      <div class="final-name"><span class="final-no">${esc(S.num)}번</span> 정답 공개</div>
      <p style="margin:0">내 종이에 적은 답과 비교해 봐요.</p>
    </section>
    ${quizBox(d,true)}
    <section class="panel fade">${thoughtHtml(d)}</section>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="toDone">← 문제 화면으로 돌아가기</button></div>`;
}

/* 이벤트 */
app.addEventListener("input",e=>{
  const el=e.target; const f=el.dataset.field; if(!f) return;
  if(f==="num"||f==="name"){ S[f]=el.value; const b=document.getElementById("startBtn"); if(b) b.disabled=!(S.num && S.name.trim()); save(); return; }
  const d=D();
  if(f==="question") d.question=el.value;
  if(f==="answer") d.answer=el.value;
  if(f==="opt") d.options[+el.dataset.i]=el.value;
  save();
});
function keepScroll(fn){ const y=window.scrollY; fn(); render(); window.scrollTo(0,y); }
function act(a,el){
  const d=D();
  switch(a){
    case "start": if(S.num && S.name.trim()){ S.step="unit"; } break;
    case "pickUnit": S.unit=+el.dataset.unit; d.unit=S.unit; S.step="write"; S.ui={}; break;
    case "toUnit": S.step="unit"; S.ui={}; break;
    case "setType": return keepScroll(()=>{ if(d.type!==el.dataset.v){ d.type=el.dataset.v; d.trap=null; d.trapReason=null; if(d.type==="sa") d.correct=null; } });
    case "setArea": return keepScroll(()=>{ if(d.area!==el.dataset.v){ d.area=el.dataset.v; d.goal=null; if(d.trapReason!=null && !(REASON_SET[d.area]||[]).includes(d.trapReason)) d.trapReason=null; } });
    case "setGoal": return keepScroll(()=>{ d.goal=el.dataset.v; });
    case "useType": {
      const t=el.dataset.type, ar=el.dataset.area;
      if(d.type!==t){ d.type=t; d.trap=null; d.trapReason=null; if(t==="sa") d.correct=null; }
      if(d.area!==ar){ d.area=ar; d.goal=null; if(d.trapReason!=null && !(REASON_SET[ar]||[]).includes(d.trapReason)) d.trapReason=null; }
      S.ui.typesOpen=false; render();
      const c=document.querySelector(".panel"); if(c) c.scrollIntoView({block:"start"});
      return; }
    case "setTarget": return keepScroll(()=>{ d.target=+el.dataset.v; });
    case "setTrap": return keepScroll(()=>{ d.trap=+el.dataset.v; });
    case "setReason": return keepScroll(()=>{ d.trapReason=+el.dataset.v; });
    case "setCorrect": return keepScroll(()=>{ const i=+el.dataset.i; d.correct = d.correct===i?null:i; if(d.trap===d.correct) d.trap=null; });
    case "review": S.step="feedback"; S.ui={}; window.scrollTo(0,0); break;
    case "back": S.step="write"; S.ui={}; window.scrollTo(0,0); break;
    case "adoptTarget": d.target=+el.dataset.v; break;
    case "complete": d.unit=d.unit||S.unit; S.step="done"; S.ui={}; window.scrollTo(0,0); break;
    case "toDone": S.step="done"; S.ui={}; window.scrollTo(0,0); break;
    case "askReset": S.ui.confirmReset=true; window.scrollTo(0,0); break;
    case "resetNo": S.ui.confirmReset=false; break;
    case "resetYes": S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} break;
  }
  render();
}

app.addEventListener("toggle",e=>{ if(e.target.matches && e.target.matches("details.types")) S.ui.typesOpen=e.target.open; },true);
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b || b.disabled) return; act(b.dataset.act,b); });

/* 2초 길게 누르기: 완성 화면에서 정답 공개 또는 피드백으로 이동 */
let holdTimer=null;
const holdBtnOf=t=>t && t.closest ? t.closest("button.hold[data-to]") : null;
function holdStart(e){
  const b=holdBtnOf(e.target); if(!b) return;
  if(e.type==="keydown" && !(e.key===" "||e.key==="Enter")) return;
  if(e.type==="keydown" && e.repeat) return;
  e.preventDefault(); holdEnd(); b.classList.add("holding");
  const to=b.dataset.to;
  holdTimer=setTimeout(()=>{ S.step=to; S.ui={}; window.scrollTo(0,0); render(); },2000);
}
function holdEnd(){ clearTimeout(holdTimer); holdTimer=null; document.querySelectorAll("button.hold.holding").forEach(b=>b.classList.remove("holding")); }
document.addEventListener("pointerdown",holdStart);
document.addEventListener("keydown",holdStart);
["pointerup","pointercancel","keyup"].forEach(t=>document.addEventListener(t,holdEnd));
document.addEventListener("pointerout",e=>{ const b=holdBtnOf(e.target); if(b && holdBtnOf(e.relatedTarget)!==b) holdEnd(); });
document.addEventListener("contextmenu",e=>{ if(holdBtnOf(e.target)) e.preventDefault(); });
render();
</script>
</body>
</html>
